name: CI-CD-Deploy

on:
  push:
    branches:
      - dev
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-api:${{ github.ref_name }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-api:${{ github.ref_name }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            BRANCH=${{ github.ref_name }}

            if [ "$BRANCH" = "prod" ]; then
              PORT=80
            else
              PORT=88
            fi

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hello-api:$BRANCH
            docker stop hello-$BRANCH || true
            docker rm hello-$BRANCH || true
            docker run -d --name hello-$BRANCH -p $PORT:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/hello-api:$BRANCH
